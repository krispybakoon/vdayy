<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Surprise</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffb6c1;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .ask-button { background-color: #ff69b4; color: white; }
        .yes-button { background-color: #ff1493; color: white; }
        .no-button { background-color: #d3d3d3; color: black; }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <p id="message">hi bubs. you didn't reply me properly the first time. so I shall ask again.</p>
        <button class="ask-button" onclick="askAgain()">what is it</button>
        <div id="response-buttons" style="display:none;">
            <button class="yes-button" onclick="yesResponse()">yes hehe</button>
            <button class="no-button" onclick="noResponse()">boooooo no</button>
        </div>
        <div id="next-step" style="display:none;">
            <p>valentines is really special to me and we don't really have the whole day so tell me what is something you really want to do/ receive, bc I wna surprise you too!</p>
            <textarea id="wish-box" placeholder="Type here..."></textarea>
            <button class="yes-button" onclick="saveWish()">Submit</button>
        </div>
        <div id="saved-wishes" style="display:none;">
            <h3>Saved wishes:</h3>
            <ul id="wish-list"></ul>
        </div>
    </div>

    <script>
        function askAgain() {
            document.getElementById("message").innerText = "would you be my valentine?";
            document.querySelector(".ask-button").style.display = "none";
            document.getElementById("response-buttons").style.display = "block";
        }
        
        function yesResponse() {
            document.getElementById("message").style.display = "none";
            document.getElementById("response-buttons").style.display = "none";
            document.getElementById("next-step").style.display = "block";
            loadWishes();
        }
        
        function noResponse() {
            alert("wrong answer, try again.");
        }
        
        function saveWish() {
            let wish = document.getElementById("wish-box").value;
            if (wish.trim() !== "") {
                let wishes = JSON.parse(localStorage.getItem("wishes")) || [];
                wishes.push(wish);
                localStorage.setItem("wishes", JSON.stringify(wishes));
                loadWishes();
                document.getElementById("wish-box").value = "";
            }
        }
        
        function loadWishes() {
            let wishes = JSON.parse(localStorage.getItem("wishes")) || [];
            let wishList = document.getElementById("wish-list");
            wishList.innerHTML = "";
            wishes.forEach(wish => {
                let li = document.createElement("li");
                li.innerText = wish;
                wishList.appendChild(li);
            });
            if (wishes.length > 0) {
                document.getElementById("saved-wishes").style.display = "block";
            }
        }

        document.addEventListener("DOMContentLoaded", loadWishes);
    </script>
</body>
</html>
